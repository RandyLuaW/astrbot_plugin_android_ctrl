name: astrbot_plugin_android_ctrl
display_name: 安卓设备操控
desc: "通过 adb 连接安卓模拟器或真机，把设备操作能力交给模型：截图直接进入模型上下文（无需额外视觉模型）、读取界面元素树获取精确坐标、支持点击/滑动/文本输入/按键/通知读取。默认仅管理员私聊可用，带每日截图与操作次数上限、单轮时长上限与冷却。"
short_desc: adb 驱动安卓设备，模型看图并操作界面
author: Randy Lua
repo: https://github.com/RandyLuaW/astrbot_plugin_android_ctrl
version: 1.1.0
astrbot_version: ">=4.17.0"
support_platforms:
  - aiocqhttp
tags:
  - 安卓
  - 模拟器
  - adb
  - 视觉
  - 自动化
